<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#E9DDC8;--sg:#829477;--btn:#5f7456;--acc:#4f6347;--ink:#2b2a26;--mut:#6a665c;--card:#fff;--ln:#e6dece;--h2:#dbe2d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1a1b18;--sf:#262520;--card:#22231f;--acc:#a9bd9e;--ink:#f1ece0;--mut:#b3ac9b;--ln:#38362d;--h2:#2c3228}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3,.logo{font-family:"Playfair Display",Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(30px,6vw,50px)}h2{font-size:clamp(24px,4vw,34px);text-align:center}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}p{margin:0 0 .8em}
.w{max-width:1120px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--bg);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{margin:0;font-size:17px;letter-spacing:.08em;color:var(--acc)}
nav a{margin-left:14px;font-size:14px}nav a:hover{color:var(--acc)}
section{padding:52px 0}.alt{background:var(--sf)}.sub{text-align:center;color:var(--mut);max-width:600px;margin:0 auto 28px}
.mut{color:var(--mut)}.eye{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--acc)}
.btn{display:inline-block;background:var(--btn);color:#fff;padding:10px 18px;border-radius:99px;font:600 14px system-ui,sans-serif;border:1.5px solid var(--btn);cursor:pointer;text-align:center}
.btn.o{background:transparent;color:var(--acc);border-color:var(--sg)}
.pick{display:inline-block;background:var(--card);border:1px solid var(--sg);color:var(--acc);padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600}
.hero{padding:44px 0;background:linear-gradient(135deg,var(--sf),var(--h2))}
.hg{display:grid;gap:28px;align-items:center}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:18px}.mos img{border-radius:18px;aspect-ratio:1;object-fit:cover}.mos img:nth-child(even){transform:translateY(18px)}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g.m{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px 8px;text-align:center;font-weight:600;font-size:14px}.cat:hover{border-color:var(--sg)}.cat span{display:block;font-size:30px}
.c,.f,.st div{background:var(--card);border:1px solid var(--ln);border-radius:14px}
.c{overflow:hidden;display:flex;flex-direction:column}.c img{width:100%;aspect-ratio:1;object-fit:cover}
.cb{padding:12px;display:flex;flex-direction:column;gap:7px;flex:1;align-items:flex-start}.cb b{font-weight:600;line-height:1.3}.cb .btn{width:100%;padding:8px 10px;font-size:13px}.cb>.o{margin-top:auto}
.pr{color:var(--acc);font-weight:700}.tag{font-size:12px;padding:2px 10px;border-radius:99px}.in{background:#e1ebd9;color:#3b5530}.out{background:#f4ddd5;color:#8a3a25}
.f{padding:20px}.f>span{font-size:30px;display:block}.f h3{font-size:18px;margin:.3em 0}.stars{color:#c99a2e;letter-spacing:2px}
.st{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.st div{padding:18px}.st b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--btn);color:#fff;margin-bottom:8px}
.fl{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:14px 0}.fl input{grid-column:1/-1}
.fl input,.fl select,.fm input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.pd{display:grid;gap:26px}.pd>img{border-radius:18px;width:100%;aspect-ratio:1;object-fit:cover}
.fm{display:grid;gap:14px;max-width:560px;margin:auto}.fm label{font-weight:600;font-size:14px;display:grid;gap:6px}
.cg{display:grid;gap:22px}.map{display:grid;place-items:center;min-height:210px;border-radius:16px;text-align:center;padding:16px;background:repeating-linear-gradient(45deg,var(--h2),var(--h2) 12px,var(--card) 12px,var(--card) 24px)}.map .btn{margin:4px}
footer{background:#2f3a2a;color:#e8efe2;padding:34px 0;font-size:14px}footer a{margin-right:14px;text-decoration:underline}
@media(min-width:760px){.fl{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.fl input{grid-column:auto}.hg{grid-template-columns:1.1fr 1fr}.pd,.cg{grid-template-columns:1fr 1fr}nav a{margin-left:26px}.logo{font-size:21px}}
.adm header,.adm footer{display:none}.ad{display:flex;flex-direction:column;min-height:100vh}
aside{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--sf);align-items:center}aside>b,aside>small{display:none}aside button,aside a{white-space:nowrap;background:none;border:0;color:var(--ink);font:600 14px system-ui,sans-serif;padding:9px 12px;border-radius:10px;cursor:pointer}aside .on,aside button:hover,aside a:hover{background:var(--card);color:var(--acc)}
.am{padding:18px;flex:1;min-width:0}.l{text-align:left;margin-bottom:.8em}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}.r img{border-radius:8px;object-fit:cover}.gr1{flex:1;min-width:160px}.ac{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ac .btn{padding:6px 12px;font-size:13px}
.al{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}.ok{background:#e1ebd9;color:#2f4a26}.er{background:#f4ddd5;color:#7a2f1c}.warn{background:var(--sf);border-left:4px solid var(--sg);padding:10px 14px;border-radius:8px;font-size:14px}
.th{position:relative;display:inline-block;margin:4px}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px}.th button{position:absolute;top:-4px;right:-4px;border:0;border-radius:50%;background:#8a3a25;color:#fff;width:22px;height:22px;cursor:pointer}
.fm select,.fm textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}.fm.lg{margin-top:20px}
@media(min-width:860px){.ad{flex-direction:row}aside{flex-direction:column;align-items:stretch;width:230px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}aside>b,aside>small{display:block}aside button,aside a{text-align:left}.am{padding:28px 34px}}
.fh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}.th{width:108px;vertical-align:top}.th img{width:108px;height:108px}.th .mk{position:static;display:block;width:100%;height:auto;margin-top:5px;padding:6px 4px;border-radius:8px;border:1px solid var(--sg);background:var(--card);color:var(--acc);font:600 12px system-ui,sans-serif;text-align:center;cursor:pointer}.th .mk.on{background:var(--btn);border-color:var(--btn);color:#fff}.ci{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:8px}
</style></head>
<body>
<header><div class="w nav"><a class="logo" href="#home">THE CRAFT HOUSE</a><nav><a href="#shop" data-c="">Shop</a><a href="#submit">Sell</a><a href="#contact">Contact</a></nav></div></header>
<main id="app"></main>
<footer><div class="w"><p><b>THE CRAFT HOUSE</b> — handmade products and crafts.</p><p>Store Pickup Available — Pay at Store.</p><p><a href="#shop" data-c="">Shop</a><a href="#submit">Submit Your Handmade Product</a><a href="#contact">Contact</a><a href="#admin" style="opacity:.7">Admin Login</a></p><p style="opacity:.7">© 2026 THE CRAFT HOUSE. Reviews shown are samples for demonstration.</p></div></footer>
<script>
/* ================= OWNER SETTINGS (edit these) ================= */
const STORE={whatsapp:"917655802576",phone:"+91 76558 02576",address:"Your store address here (replace this)",
maps:"https://www.google.com/maps/search/?api=1&query=YOUR+STORE+ADDRESS",
dir:"https://www.google.com/maps/dir/?api=1&destination=YOUR+STORE+ADDRESS",
hero:""/* optional: a photo link for the homepage banner */};
const CATS=[["Home Decor","🪴"],["Handmade Jewelry","📿"],["Wooden Crafts","🪵"],["Art and Paintings","🎨"],["Handmade Gifts","🎁"],["Pottery and Ceramics","🏺"],["Handmade Accessories","👜"],["Other Crafts","✂️"]];
/* ================= PRODUCT DATA ================= 
HOW TO ADD A PRODUCT
1. Copy any product line { ... } below and paste it as a new line (keep the comma at the end).
2. Give it a new unique id (lowercase letters, numbers and hyphens only).
3. Fill in: name, cat (must match a category above exactly), price (number only, no ₹),
   stock (true = Available, false = Out of Stock) and date (YYYY-MM-DD, newest shows first).
4. Add featured:true to show it in "Featured Products" on the homepage (optional).
5. Add image:"images/your-photo.jpg" to use your own photo. Leave it out to show a placeholder.
6. To remove a product, delete its line. Only products listed here appear in the public shop.
The products below are SAMPLES: replace them with your own. */
const DEF=[
{id:"terracotta-wall-planter",name:"Terracotta Wall Planter",cat:"Pottery and Ceramics",price:649,stock:true,date:"2026-11-10",featured:true,image:"",desc:"Hand-shaped terracotta planter with a warm matte finish. Perfect for small succulents and trailing greens."},
{id:"macrame-wall-hanging",name:"Macramé Wall Hanging",cat:"Home Decor",price:899,stock:true,date:"2026-11-09",featured:true,desc:"Hand-knotted cotton macramé in a soft natural tone. Brings a calm, boho feel to any wall."},
{id:"beaded-boho-necklace",name:"Beaded Boho Necklace",cat:"Handmade Jewelry",price:399,stock:true,date:"2026-11-08",featured:true,desc:"Colourful glass beads strung by hand on a durable cord with an adjustable closure."},
{id:"painted-clay-earrings",name:"Hand-Painted Clay Earrings",cat:"Handmade Jewelry",price:299,stock:true,date:"2026-11-06",desc:"Lightweight clay earrings, each one hand-painted, so no two pairs are exactly alike."},
{id:"mango-wood-tray",name:"Mango Wood Serving Tray",cat:"Wooden Crafts",price:1299,stock:true,date:"2026-11-04",featured:true,desc:"Smooth, hand-finished tray that shows off the natural wood grain. Lovely for serving or as a centrepiece."},
{id:"carved-wooden-elephant",name:"Carved Wooden Elephant",cat:"Wooden Crafts",price:749,stock:false,date:"2026-10-28",desc:"A small hand-carved elephant figurine, sanded smooth and polished."},
{id:"folk-art-painting",name:"Folk-Art Canvas Painting",cat:"Art and Paintings",price:2499,stock:true,date:"2026-11-02",desc:"An original hand-painted canvas in rich earthy colours, ready to hang."},
{id:"gift-hamper-box",name:"Handmade Gift Hamper Box",cat:"Handmade Gifts",price:1599,stock:true,date:"2026-10-30",featured:true,desc:"A thoughtfully packed hamper of handmade goodies, ideal for birthdays and festivals."},
{id:"candle-set",name:"Hand-Poured Candle Set",cat:"Handmade Gifts",price:549,stock:true,date:"2026-10-25",desc:"A set of three small hand-poured candles in gentle, calming scents."},
{id:"embroidered-tote",name:"Embroidered Tote Bag",cat:"Handmade Accessories",price:799,stock:true,date:"2026-10-22",desc:"Sturdy cotton tote with delicate hand embroidery. Roomy enough for everyday use."},
{id:"crochet-scrunchies",name:"Crochet Scrunchie Set",cat:"Handmade Accessories",price:249,stock:false,date:"2026-10-18",desc:"Soft crochet scrunchies in a set of three muted shades."},
{id:"ceramic-mug-pair",name:"Ceramic Mug Pair",cat:"Pottery and Ceramics",price:899,stock:true,date:"2026-10-15",desc:"Two hand-thrown ceramic mugs with a speckled glaze. Made for slow chai mornings."},
{id:"resin-coaster-set",name:"Resin Art Coaster Set",cat:"Other Crafts",price:699,stock:true,date:"2026-10-12",desc:"Set of four resin art coasters, each with its own swirl pattern."}
];
const DR=[["Aarti S.",5,"The wall hanging looks even prettier in person. Lovely finishing and very helpful on WhatsApp."],["Rohan M.",4,"Picked up a tray from the store. The process was easy and the piece is beautiful."],["Priya K.",5,"The perfect gift hamper for my sister. She loved the personal touch."]];
/* ================= SITE CODE (no need to edit) ================= */
const $=s=>document.querySelector(s),E=Object.fromEntries(CATS);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return 1}catch(e){return 0}};
const DRR=DR.map(([n,s,t])=>({n,s,t,h:1}));
let P=ld("ch_p",DEF),R=ld("ch_r",DRR),SUB=ld("ch_u",[]);Object.assign(STORE,ld("ch_s",{}));
const money=n=>"₹"+Number(n).toLocaleString("en-IN"),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa=t=>"https://wa.me/"+STORE.whatsapp+"?text="+encodeURIComponent(t);
const link=p=>location.href.split("#")[0]+"#p-"+p.id;
const buy=p=>wa(p.stock?`Hello THE CRAFT HOUSE! I’d like to buy this product:\n\n${p.name}\nPrice: ${money(p.price)}\nLink: ${link(p)}\n\nPlease confirm if it is available for store pickup.`:`Hello THE CRAFT HOUSE! Will “${p.name}” (${money(p.price)}) be back in stock?\nLink: ${link(p)}`);
function img(p){const f=(p.images||[]).map(U).find(Boolean)||U(p.image);if(f)return f;const h=[95,38,70,20,110,50,85,30][CATS.findIndex(c=>c[0]===p.cat)]||60;
return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h} 35% 84%)'/><stop offset='1' stop-color='hsl(${h+20} 25% 64%)'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><circle cx='320' cy='80' r='90' fill='#fff' opacity='.25'/><text x='200' y='235' font-size='120' text-anchor='middle'>${E[p.cat]||"✨"}</text></svg>`)}
const tag=p=>`<span class="tag ${p.stock?"in":"out"}">${p.stock?"Available":"Out of Stock"}</span>`;
const card=p=>`<div class="c"><a href="#p-${p.id}"><img src="${img(p)}" alt="${p.name}" width="400" height="400" loading="lazy"></a><div class="cb">${tag(p)}<b>${p.name}</b><span class="pr">${money(p.price)}</span><a class="btn o" href="#p-${p.id}">View Details</a><a class="btn" href="${buy(p)}" target="_blank" rel="noopener">${p.stock?"Buy on WhatsApp":"Ask on WhatsApp"}</a></div></div>`;
const grid=a=>`<div class="g">${a.map(card).join("")}</div>`;
const sec=(id,h,s,b,alt)=>`<section id="${id}"${alt?' class="alt"':""}><div class="w"><h2>${h}</h2>${s?`<p class="sub">${s}</p>`:""}${b}</div></section>`;
const PK=`<span class="pick">Store Pickup Available — Pay at Store.</span>`;

function home(){const L=[...P].sort((a,b)=>b.date.localeCompare(a.date)),F=P.filter(p=>p.featured).slice(0,4);
return `<section class="hero"><div class="w hg"><div><p class="eye">Handmade with love</p><h1>${esc(STORE.banner||"Discover the Beauty of Handmade")}</h1><p class="mut">Thoughtfully crafted home décor, jewelry, pottery and gifts. Message us on WhatsApp, then collect your piece in store.</p><p>${PK}</p><a class="btn" href="#shop" data-c="">Shop Now</a></div>${U(STORE.bannerImg)||STORE.hero?`<img src="${U(STORE.bannerImg)||STORE.hero}" alt="Handmade crafts" style="border-radius:18px;width:100%;aspect-ratio:4/3;object-fit:cover">`:`<div class="mos">${(F.length>3?F:L).slice(0,4).map(p=>`<img src="${img(p)}" alt="" width="400" height="400">`).join("")}</div>`}</div></section>`
+sec("categories","Shop by Categories","",`<div class="g">${CATS.map(([c,e])=>`<a class="cat" href="#shop" data-c="${c}">${U(CI[c])?`<img class="ci" src="${U(CI[c])}" alt="">`:`<span>${e}</span>`}${c}</a>`).join("")}</div>`)
+sec("featured","Featured Products","Our favourite handmade pieces.",grid(F)+`<p style="text-align:center;margin-top:24px"><a class="btn o" href="#shop" data-c="">View All Products</a></p>`,1)
+sec("latest","Latest Products","Freshly added to the shop.",grid(L.slice(0,4)))
+sec("why","Why Choose The Craft House","",`<div class="g m">${[["🤲","Truly handmade","Every piece is made by hand with care."],["✨","Unique finds","Small-batch pieces you won’t find everywhere."],["🏪","See before you pay","Collect your product in store and pay cash there."],["💬","Personal service","Ask us anything on WhatsApp before you visit."]].map(([i,t,d])=>`<div class="f"><span>${i}</span><h3>${t}</h3><p class="mut">${d}</p></div>`).join("")}</div>`,1)
+(STORE.about?sec("about","About Us","",`<p style="max-width:700px;margin:auto;text-align:center;white-space:pre-line">${esc(STORE.about)}</p>`):"")+sec("how","How It Works","Simple store pickup. No online payment needed.",`<div class="st">${["Choose a product you love.","Message us on WhatsApp.","We confirm availability.","Visit our physical store.","Collect your product and pay cash at the store."].map((t,i)=>`<div><b>${i+1}</b>${t}</div>`).join("")}</div><p style="text-align:center;margin-top:22px">${PK}<br><small class="mut">Pickup only. Home delivery is not available.</small></p>`)
+sec("sell","Submit Your Handmade Product","Are you a maker? Share your creation with us. Submissions are private: only products we review and approve appear in the shop.",`<p style="text-align:center"><a class="btn" href="#submit">Submit Your Product</a></p>`,1)
+sec("reviews","Customer Reviews",`<em>Sample reviews, shown as examples only. They are not real customer reviews.</em>`,`<div class="g m">${R.filter(r=>r.h).map(({n,s,t})=>`<div class="f"><div class="stars" aria-label="${s} out of 5 stars">${"★".repeat(s)}${"☆".repeat(5-s)}</div><p>“${t}”</p><b>${n}</b> <small class="mut">· sample</small></div>`).join("")}</div>`)
+sec("contact","Contact Us & Store Location","Message us on WhatsApp. We’ll confirm availability before you visit.",`<div class="cg"><div><p><b>WhatsApp:</b> ${STORE.phone}</p><p><b>Store address:</b> ${esc(STORE.address)}</p>${STORE.info?`<p style="white-space:pre-line">${esc(STORE.info)}</p>`:""}<p>${PK}</p><a class="btn" href="${wa("Hello THE CRAFT HOUSE! I have a question.")}" target="_blank" rel="noopener">Chat on WhatsApp</a></div><div class="map"><div><p>📍 Map placeholder</p><a class="btn o" href="${STORE.maps}" target="_blank" rel="noopener">Open in Google Maps</a><a class="btn" href="${STORE.dir}" target="_blank" rel="noopener">Get Directions</a></div></div></div>`,1)}

const st={q:"",cat:"",pr:"",av:"",so:"new"};
const opt=(a,v)=>a.map(([k,l])=>`<option value="${k}"${k===v?" selected":""}>${l}</option>`).join("");
function shop(){document.title="Shop — THE CRAFT HOUSE";
return `<section><div class="w"><h1 style="text-align:center">Shop</h1><p class="sub">${PK}</p><div class="fl"><input type="search" data-k="q" placeholder="Search by product name…" aria-label="Search" value="${esc(st.q)}"><select data-k="cat" aria-label="Category">${opt([["","All categories"],...CATS.map(c=>[c[0],c[0]])],st.cat)}</select><select data-k="pr" aria-label="Price">${opt([["","Any price"],["0-500","Under ₹500"],["500-1000","₹500 – ₹1,000"],["1000-2500","₹1,000 – ₹2,500"],["2500-","Above ₹2,500"]],st.pr)}</select><select data-k="av" aria-label="Availability">${opt([["","All stock"],["in","Available"],["out","Out of Stock"]],st.av)}</select><select data-k="so" aria-label="Sort">${opt([["new","Newest first"],["hi","Price: High to Low"],["lo","Price: Low to High"]],st.so)}</select></div><p id="cnt" class="mut"></p><div id="gr" class="g"></div></div></section>`}
function fill(){const [lo,hi]=(st.pr||"0-").split("-"),q=st.q.trim().toLowerCase();
const a=P.filter(p=>p.name.toLowerCase().includes(q)&&(!st.cat||p.cat===st.cat)&&p.price>=+lo&&(!hi||p.price<=+hi)&&(!st.av||(st.av==="in")===p.stock));
a.sort(st.so==="hi"?(x,y)=>y.price-x.price:st.so==="lo"?(x,y)=>x.price-y.price:(x,y)=>y.date.localeCompare(x.date));
$("#cnt").textContent=a.length+(a.length===1?" product":" products");$("#gr").innerHTML=a.map(card).join("")||"<p>No products match your filters.</p>"}

function prod(id){const p=P.find(x=>x.id===id);
if(!p)return `<section><div class="w"><h2>Product not found</h2><p class="sub"><a class="btn" href="#shop" data-c="">Back to shop</a></p></div></section>`;
